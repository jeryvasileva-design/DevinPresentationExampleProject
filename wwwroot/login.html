<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <link href="site.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js" defer></script>
    <title>Вход и Регистрация</title>
</head>

<body>
    <header class="bg-wine py-3">
        <div class="container-fluid d-flex flex-wrap justify-content-between align-items-center px-4 gap-3">
            <a href="index.html" class="text-light text-decoration-none fw-bold fs-4">РИСУВАНЕ С ВИНО</a>
            <nav>
                <ul class="list-unstyled d-flex flex-wrap gap-4 mb-0 align-items-center">
                    <li><a href="login.html" class="text-light fw-bold text-decoration-none" id="registerLink">Вход / Регистрация</a></li>
                    <li class="nav-item d-none" id="save"><a class="nav-link text-light fw-bold text-decoration-none" href="SaveHour.html">Запази час</a></li>
                    <li class="nav-item d-none" id="acc"><a class="nav-link text-light fw-bold text-decoration-none" href="account.html">Профил</a></li>
                    <li><button id="logoutBtn" class="d-none">Изход</button></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="flip-main-container">
        <div class="flip-card-inner" id="flipCard">

            <div class="auth-side auth-front">
                <div class="row g-0 h-100">
                    <div class="col-md-5 d-none d-md-block">
                        <div >
                            <img src="./photos/loginPhoto.jpg" class="side-img" alt="Login" style="width: 150%;">
                        </div>
                    </div>
                    <div class="col-md-7 p-5 d-flex flex-column justify-content-center" style="background-color: #FAF3EB;">
                        <h2 class="fw-bold text-dark display-6 mb-5">Здравейте отново!</h2>
                        <form id="login" action="/api/login" method="post">
                            <div class="mb-4">
                                <label class="fw-bold">Имейл</label>
                                <input type="email" class="form-control form-control-underline" placeholder="Вашият имейл" name="email">
                            </div>
                            <div class="mb-4">
                                <label class="fw-bold">Парола</label>
                                <input type="password" class="form-control form-control-underline" placeholder="••••••••" name="password">
                            </div>
                            <button type="submit" class="btn btn-custom mt-3">Вход в профил</button>
                            <div class="mt-5 text-center">
                                <p class="text-muted small">Нямате акаунт?
                                    <a href="javascript:void(0)" onclick="toggleFlip()" class="text-wine fw-bold text-decoration-none ms-1 border-bottom border-dark">Регистрация</a>
                                </p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="auth-side auth-back">
                <div class="row g-0 h-100">
                    <div class="col-md-7 p-5 d-flex flex-column justify-content-center" style="background-color: #FAF3EB;">
                        <h2 class="fw-bold text-dark display-6 mb-5">Регистрирай се за незабравими преживявания!</h2>
                        <form id="registation" action="/api/register" method="post">
                            <div class="mb-4">
                                <label class="fw-bold">Име и фамилия</label>
                                <input type="text" class="form-control form-control-underline" placeholder="Вашето име" name="userName" id="username">
                            </div>
                            <div class="mb-4">
                                <label class="fw-bold">Email</label>
                                <input type="email" class="form-control form-control-underline" placeholder="Вашият имейл" name="email" id="email">
                            </div>
                            <div class="mb-4">
                                <label class="fw-bold">Парола</label>
                                <input type="password" class="form-control form-control-underline" placeholder="••••••••" name="password" id="password">
                            </div>
                            <button type="submit" class="btn btn-custom mt-3">Регистрирай се</button>
                            <div class="mt-5 text-center">
                                <p class="text-muted small">Вече имате профил?
                                    <a href="javascript:void(0)" onclick="toggleFlip()" class="text-wine fw-bold text-decoration-none ms-1 border-bottom border-dark">Влез в акаунт</a>
                                </p>
                            </div>
                        </form>
                    </div>
                    <div class="col-md-5 d-none d-md-block">
                        <div >
                            <img src="./photos/signPhoto.jpg" class="side-img" alt="Login" style="width: 110%;">
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        function toggleFlip() {
            document.getElementById('flipCard').classList.toggle('is-flipped');
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
